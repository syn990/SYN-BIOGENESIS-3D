<svg xmlns="http://www.w3.org/2000/svg" width="820" height="396" viewBox="0 0 820 396" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Where the water's living keep</title>
<rect x="0.5" y="0.5" width="819" height="395" rx="8" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
