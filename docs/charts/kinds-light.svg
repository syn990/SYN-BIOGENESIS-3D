<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>What the living are made of, on the plane and in the water</title>
<rect x="0.5" y="0.5" width="819" height="299" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="24" y="34" font-size="16" font-weight="600" fill="#0b0b0b">What the living are made of, on the plane and in the water</text>
<text x="24" y="56" font-size="13" fill="#52514e">Share of the living length at time 400 by kind, mean over the living worlds of seeds 1 to 24</text>
<line x1="24" y1="82" x2="42" y2="82" stroke="#1baf7a" stroke-width="2" stroke-linecap="round"/>
<text x="48" y="86" font-size="12" fill="#52514e">plants</text>
<line x1="112.6" y1="82" x2="130.6" y2="82" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<text x="136.6" y="86" font-size="12" fill="#52514e">mixed</text>
<line x1="194.1" y1="82" x2="212.1" y2="82" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/>
<text x="218.1" y="86" font-size="12" fill="#52514e">hunters</text>
<text x="24" y="116" font-size="13" fill="#0b0b0b">Biogenesis 0.9, on its plane (1,000 x 1,000) · 24 worlds alive</text>
<rect x="24.0" y="124" width="401.5" height="26" rx="4" fill="#1baf7a"/>
<text x="225.7" y="168" font-size="12" fill="#52514e" text-anchor="middle">plants 52%</text>
<rect x="427.5" y="124" width="319.1" height="26" rx="4" fill="#2a78d6"/>
<text x="588.0" y="168" font-size="12" fill="#52514e" text-anchor="middle">mixed 42%</text>
<rect x="748.6" y="124" width="45.4" height="26" rx="4" fill="#eb6834"/>
<text x="772.3" y="168" font-size="12" fill="#52514e" text-anchor="middle">6%</text>
<text x="24" y="198" font-size="13" fill="#0b0b0b">SYN-BIOGENESIS-3D, in the water (600 x 600 x 300) · 24 worlds alive</text>
<rect x="24.0" y="206" width="401.2" height="26" rx="4" fill="#1baf7a"/>
<text x="225.6" y="250" font-size="12" fill="#52514e" text-anchor="middle">plants 52%</text>
<rect x="427.2" y="206" width="230.3" height="26" rx="4" fill="#2a78d6"/>
<text x="543.4" y="250" font-size="12" fill="#52514e" text-anchor="middle">mixed 30%</text>
<rect x="659.5" y="206" width="134.5" height="26" rx="4" fill="#eb6834"/>
<text x="727.8" y="250" font-size="12" fill="#52514e" text-anchor="middle">hunters 18%</text>
